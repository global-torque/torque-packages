name: Publish verified framework release to npm

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run containing the retained tarballs
        required: true
        type: string
      candidate:
        description: Candidate version in the retained receipt
        required: true
        type: string
        default: 0.4.0
      release_tag:
        description: Immutable GitHub release tag carrying the exact candidate assets
        required: true
        type: string
        default: framework-v0.4.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and reverify the exact retained candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE: ${{ inputs.candidate }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          rm -rf release
          mkdir release
          gh release download "$RELEASE_TAG" --dir release \
            --pattern '*.tgz' --pattern '*.tgz.manifest.json' --pattern '*.tgz.sha512' \
            --pattern 'candidate-receipt.json' --pattern 'selected-release.json' \
            --pattern 'original-provenance.json' --pattern 'transport-receipt.json' \
            --pattern 'pnpm-lock.canonical.yaml' --pattern 'pnpm-lock.derived.yaml' \
            --pattern 'pnpm-workspace.canonical.yaml' --pattern 'pnpm-workspace.derived.yaml'
          gh release verify "$RELEASE_TAG"
          for asset in release/*; do
            gh release verify-asset "$RELEASE_TAG" "$(basename "$asset")"
          done
          node scripts/verify-provenance-context.mjs \
            release/candidate-receipt.json "$CANDIDATE_RUN_ID" "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY" "$RUNNER_TEMP/framework-publish-context.json"
          node scripts/verify-release-bundle.mjs release/candidate-receipt.json
      - name: Publish exact retained tarballs sequentially with trusted OIDC
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          receipt="release/candidate-receipt.json"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$receipt', 'utf8')).candidate")" = "$CANDIDATE"
          mkdir -p registry
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('release/candidate-receipt.json', 'utf8'));
          const expected = [
            '@global-torque/domain-types',
            '@global-torque/invest-core',
            '@global-torque/invest-data',
            '@global-torque/invest-runtime',
            '@global-torque/invest-widgets',
            '@global-torque/invest-features',
            '@global-torque/invest-shell',
          ];
          if (JSON.stringify(receipt.dependencyOrder) !== JSON.stringify(expected)) {
            throw new Error('Candidate dependency order is not the reviewed framework order.');
          }
          if (receipt.packages.some((entry, index) => entry.name !== expected[index])) {
            throw new Error('Candidate package entries are not ordered for publication.');
          }
          JS
          packages=(domain-types invest-core invest-data invest-runtime invest-widgets invest-features invest-shell)
          : > publication-receipt.jsonl
          for package in "${packages[@]}"; do
            archive="release/global-torque-${package}-${CANDIDATE}.tgz"
            test -f "$archive"
            npm publish "$archive" --access public --provenance --tag latest
            registry_archive=$(npm pack "@global-torque/${package}@${CANDIDATE}" --pack-destination registry | tail -n 1)
            test -f "registry/$registry_archive"
            cmp "$archive" "registry/$registry_archive"
            node --input-type=module - "$archive" "$registry_archive" "$package" "$CANDIDATE" <<'JS' >> publication-receipt.jsonl
            import crypto from 'node:crypto';
            import fs from 'node:fs';
            const [, , archive, registryArchive, packageName, version] = process.argv;
            const digest = file => crypto.createHash('sha512').update(fs.readFileSync(file)).digest('hex');
            console.log(JSON.stringify({ package: `@global-torque/${packageName}`, version, archive, sha512: digest(archive), registryArchive, registrySha512: digest(`registry/${registryArchive}`) }));
            JS
          done
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const lines = fs.readFileSync('publication-receipt.jsonl', 'utf8').trim().split('\n').filter(Boolean).map(line => JSON.parse(line));
          if (lines.length !== 7 || lines.some(entry => entry.sha512 !== entry.registrySha512)) throw new Error('Registry byte verification is incomplete.');
          fs.writeFileSync('publication-receipt.json', `${JSON.stringify({ schemaVersion: 1, candidate: process.env.CANDIDATE, dependencyOrder: lines.map(entry => entry.package), packages: lines, receiptSha256: crypto.createHash('sha256').update(fs.readFileSync('release/candidate-receipt.json')).digest('hex') }, null, 2)}\n`);
          JS
      - name: Retain publication receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: torque-framework-publication-${{ inputs.candidate }}
          path: publication-receipt.json
          if-no-files-found: error
          retention-days: 90
