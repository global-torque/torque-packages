name: Verify framework release provenance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable framework release tag to verify
        required: true
        type: string
        default: framework-v0.4.14

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^framework-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          source_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          mkdir -p release
          gh release download "$RELEASE_TAG" --dir release --pattern '*.tgz'
          gh release verify "$RELEASE_TAG"
          for package in domain-types invest-core invest-data invest-runtime invest-widgets invest-features invest-shell; do
            archive="release/global-torque-${package}-${version}.tgz"
            test -f "$archive"
            gh release verify-asset "$RELEASE_TAG" "$archive"
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$source_sha" --source-digest "$source_sha" \
              --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners
          done
          test "$(find release -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 7
