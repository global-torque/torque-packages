name: Framework package candidate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate version to pack from the checked source
        required: true
        type: string
        default: 0.4.12

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: corepack enable && corepack prepare pnpm@12.4.2 --activate
      - name: Install checked dependency graph
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack the exact candidate once
        env:
          CANDIDATE: ${{ inputs.candidate }}
          REQUIRE_CLEAN_SOURCE: 'true'
          CSS_BROWSER_REPORT: ${{ runner.temp }}/torque-css-browser-report.json
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          CSS_BROWSER_REPORT="$CSS_BROWSER_REPORT" pnpm --filter @global-torque/invest-shell run test:css-browser
          pnpm run pack:candidate -- "$CANDIDATE"
      - name: Attest exact candidate archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/*.tgz
      - name: Retain exact candidate and combined receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: torque-framework-candidate-${{ inputs.candidate }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
