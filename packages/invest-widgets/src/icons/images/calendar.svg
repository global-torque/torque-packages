    x="4.5"
    y="7.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />
  <rect
    x="7.5"
    y="7.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />
  <rect
    x="10.5"
    y="7.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />

  <rect
    x="4.5"
    y="10.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />
  <rect
    x="7.5"
    y="10.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />
  <rect
    x="10.5"
    y="10.5"
    width="1"
    height="1"
    stroke="currentColor"
    stroke-width="0.6"
  />
</svg>
